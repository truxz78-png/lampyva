# Builds the signed Lampyva app (.aab) for Google Play. Run it by hand:
#   gh workflow run build-android.yml
# The .aab is saved as an "Artifact" of the run (it does not upload anything to Play Console).
name: Build Android app

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lampyva-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
